name: Daily Auto Fetch

run-name: Daily Auto Fetch (${{ github.event_name }})

on:
  schedule:
    - cron: '17 22 * * *' # Primary: JST 07:17
    - cron: '47 0 * * *'  # Recovery: JST 09:47; skips after a successful primary run
  workflow_dispatch:

concurrency:
  group: daily-auto-fetch-main
  cancel-in-progress: false

jobs:
  auto-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      STATUS_BATCH_LIMIT: '30'
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -r requirements.txt

      - name: Check required secrets are set
        run: |
          test -n "${YOUTUBE_API_KEY}" && echo "YOUTUBE_API_KEY=present" || (echo "YOUTUBE_API_KEY=missing" && exit 1)
          test -n "${SPREADSHEET_ID}" && echo "SPREADSHEET_ID=present" || (echo "SPREADSHEET_ID=missing" && exit 1)
          test -n "${GCP_SERVICE_ACCOUNT_JSON}" && echo "GCP_SERVICE_ACCOUNT_JSON=present" || (echo "GCP_SERVICE_ACCOUNT_JSON=missing" && exit 1)

      - name: Resolve JST run date
        id: run-date
        shell: bash
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today's completion marker
        id: completion-cache
        uses: actions/cache/restore@v4
        with:
          path: .daily-auto-fetch-success
          key: daily-auto-fetch-success-${{ steps.run-date.outputs.date }}

      - name: Run daily auto fetch
        if: steps.completion-cache.outputs.cache-hit != 'true'
        run: python -m scripts.run_daily_auto_fetch

      - name: Record successful completion
        if: steps.completion-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf 'date=%s\nrun_id=%s\n' \
            '${{ steps.run-date.outputs.date }}' \
            '${{ github.run_id }}' > .daily-auto-fetch-success

      - name: Save today's completion marker
        if: steps.completion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .daily-auto-fetch-success
          key: daily-auto-fetch-success-${{ steps.run-date.outputs.date }}

      - name: Report an already completed day
        if: steps.completion-cache.outputs.cache-hit == 'true'
        run: echo "Daily Auto Fetch already completed for ${{ steps.run-date.outputs.date }}; skipping duplicate writes."

      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search '"[automation] Daily Auto Fetch failed" in:title' \
            --json number \
            --jq '.[0].number // empty')"
          body="Daily Auto Fetch failed on $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Run: ${RUN_URL}"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title '[automation] Daily Auto Fetch failed' \
              --body "$body"
          fi

      - name: Close the failure issue after recovery
        if: success() && steps.completion-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search '"[automation] Daily Auto Fetch failed" in:title' \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Daily Auto Fetch recovered successfully. Run: ${RUN_URL}"
          fi

  keepalive:
    name: Keep scheduled workflow active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record activity after 30 quiet days
        shell: bash
        run: |
          set -euo pipefail

          latest_commit_epoch="$(git log -1 --format=%ct)"
          current_epoch="$(date +%s)"
          keepalive_interval_seconds=$((30 * 24 * 60 * 60))

          if (( current_epoch - latest_commit_epoch < keepalive_interval_seconds )); then
            echo "A repository commit was made within the last 30 days; no keepalive is needed."
            exit 0
          fi

          printf 'Last keepalive: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/workflow-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflow-keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${GITHUB_REF_NAME}"
