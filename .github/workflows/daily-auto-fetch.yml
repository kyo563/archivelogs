name: Daily Auto Fetch

on:
  schedule:
    - cron: '17 22 * * *' # JST 07:17 (avoid the busy top of the hour)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to Sheets"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  auto-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      WORKSHEET_NAME: ${{ secrets.WORKSHEET_NAME }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      STATUS_BATCH_LIMIT: '30'
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets are set
        run: |
          test -n "${YOUTUBE_API_KEY}" && echo "YOUTUBE_API_KEY=present" || (echo "YOUTUBE_API_KEY=missing" && exit 1)
          test -n "${SPREADSHEET_ID}" && echo "SPREADSHEET_ID=present" || (echo "SPREADSHEET_ID=missing" && exit 1)
          test -n "${GCP_SERVICE_ACCOUNT_JSON}" && echo "GCP_SERVICE_ACCOUNT_JSON=present" || (echo "GCP_SERVICE_ACCOUNT_JSON=missing" && exit 1)

      - name: Run daily auto fetch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scripts.run_daily_auto_fetch --dry-run
          else
            python -m scripts.run_daily_auto_fetch
          fi

  keepalive:
    name: Keep scheduled workflow active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record activity after 30 quiet days
        shell: bash
        run: |
          set -euo pipefail

          latest_commit_epoch="$(git log -1 --format=%ct)"
          current_epoch="$(date +%s)"
          keepalive_interval_seconds=$((30 * 24 * 60 * 60))

          if (( current_epoch - latest_commit_epoch < keepalive_interval_seconds )); then
            echo "A repository commit was made within the last 30 days; no keepalive is needed."
            exit 0
          fi

          printf 'Last keepalive: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/workflow-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflow-keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${GITHUB_REF_NAME}"
